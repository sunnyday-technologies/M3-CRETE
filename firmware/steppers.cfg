# ============================================================================
# Stepper Motors — Motion + Extruder
# ============================================================================
# DEVELOPMENT REFERENCE — not the machine config. The config SN 001 runs is
# klipper/printer.cfg in github.com/sunnyday-technologies/M3-CRETE-FIRMWARE.
#
# Driver slot allocation on the BTT Kraken V1.0 (8 onboard drivers, S1-S8):
#   S1 (MOTOR1) -> stepper_z    (Z0 front-left)
#   S2 (MOTOR2) -> stepper_z1   (Z1 front-right)
#   S3 (MOTOR3) -> stepper_z2   (Z2 rear-left)
#   S4 (MOTOR4) -> stepper_z3   (Z3 rear-right)
#   S5 (MOTOR5) -> stepper_x    (single X motor)
#   S6 (MOTOR6) -> stepper_y    (Y-left, primary)
#   S7 (MOTOR7) -> stepper_y1   (Y-right, secondary — dual drive, anti-racking)
#   S8 (MOTOR8) -> extruder     (printhead extruder / nozzle valve)
# Z on S1-S4 is the hardware-verified Stage-1 allocation in M3-CRETE-FIRMWARE.
# X/Y on S5/S6 follow its Stage-1 stubs. S1-S4 and S5-S8 have different sense
# resistors — see tmc.cfg.
#
# PIN SOURCE: BTT's official generic-bigtreetech-kraken.cfg
#   (github.com/bigtreetech/BIGTREETECH-Kraken, Firmware/, commit 4a3303f),
#   cross-checked against BTT's Kraken V1.0 pin diagram and Marlin's
#   pins_BTT_KRAKEN_V1_0.h. S1-S4 match the hardware-verified Stage-1 config;
#   S5-S8 have not been run on the machine yet.
#
# The material pump (MAI 2PUMP Pictor) is not modelled here — see the
# EXTRUDER section at the end of this file.
#
# Belt / pulley math (X and Y):
#   GT2 belt pitch:     2 mm
#   Pulley:             20 tooth
#   rotation_distance:  2 * 20 = 40 mm/rev
#   Full step:          200 steps/rev (1.8° motors)
#   Microsteps:         16 (with interpolation, see tmc.cfg)
#   Resolution:         40 / (200 * 16) = 0.0125 mm/microstep
#
# Lead-screw math (Z, Tr8x2 single start):
#   rotation_distance:  2 mm/rev (the screw lead)
#   Resolution:         2 / (200 * 16) = 0.000625 mm/microstep
# ============================================================================

# ----------------------------------------------------------------------------
# X AXIS — belt-pinion drive (motor travels WITH the printhead)
# ----------------------------------------------------------------------------
# Architecture: the X motor is mounted on the X-carriage and its pulley
# rolls along a single fixed strand of 6mm GT2 belt that's anchored at
# both ends of the gantry beam. Rotating the pinion drives the carriage
# along the belt like a rack-and-pinion — there's no belt loop.
#
# Why belt-pinion on X:
#   - No 4m+ belt loop to stretch and resonate
#   - Simpler tensioning (two fixed anchors, no idler pulleys)
#   - Scales cleanly to longer X spans (M3-4 variant etc.)
#
# Consequences for this config:
#   - rotation_distance is UNCHANGED (40 = 20T * 2mm pitch, same math)
#   - Motor wires travel in the X drag chain alongside the printhead
#   - Direction polarity is often inverted from a loop-drive cartesian —
#     if X+ jogs the wrong way on first-motion test, toggle the '!' on
#     dir_pin below
#   - Moving mass includes the motor itself — keep accel conservative
#     until input shaping is tuned
# ----------------------------------------------------------------------------
# S5 (MOTOR5)
[stepper_x]
step_pin: PG9
dir_pin: PG10                # toggle '!' prefix if first-motion test moves wrong way
enable_pin: !PG13
rotation_distance: 40
microsteps: 16
full_steps_per_rotation: 200
endstop_pin: tmc5160_stepper_x:virtual_endstop
position_endstop: 0
position_min: 0
position_max: 2000
homing_speed: 25             # sensorless — start conservative
homing_retract_dist: 0       # sensorless: MUST be 0 (no retract on stall)

# ----------------------------------------------------------------------------
# Y AXIS — dual motors at the REAR (anti-racking, loop-driven)
# ----------------------------------------------------------------------------
# Both Y motors are mounted at the REAR of the machine. The belts run from
# rear pulleys forward to idlers at the front and back. Home position (Y=0)
# is at the FRONT of the machine, so Y+ moves the gantry AWAY from home
# (toward the rear motors). If this is reversed on first-motion test,
# toggle the '!' on dir_pin below — BOTH Y motors must flip together.
# ----------------------------------------------------------------------------
# S6 (MOTOR6)
[stepper_y]
step_pin: PG11
dir_pin: PD7
enable_pin: !PG12
rotation_distance: 40
microsteps: 16
full_steps_per_rotation: 200
endstop_pin: tmc5160_stepper_y:virtual_endstop
position_endstop: 0
position_min: 0
position_max: 1000
homing_speed: 25
homing_retract_dist: 0

# S7 (MOTOR7)
[stepper_y1]
step_pin: PB4
dir_pin: PB3
enable_pin: !PB5
rotation_distance: 40
microsteps: 16
full_steps_per_rotation: 200
# y1 follows y — no endstop, homes together with the primary

# ----------------------------------------------------------------------------
# Z AXIS — four independent motors, Tr8x2 lead screws, sensorless homing DOWN
# ----------------------------------------------------------------------------
# Drive: each post has a Tr8x2 lead screw (8 mm, 2 mm lead, single start)
# turned from the top: motor shaft down through an 8 mm coupler. At the
# motor-mount floor, an 8x16x5 thrust bearing and a lock collar sit on each
# side of the floor (BOM ids 92, 90): together they carry the gantry weight
# and the homing thrust, so the motor bearings only see torque. At the
# bottom, a 608ZZ (id 89) in the printed bottom holder (id 91) centres the
# screw, which floats axially in it; the holder's top face is the hard stop
# Z homes onto. The 2 mm lead is chosen to resist back-driving, so the gantry
# should hold its height when the motors are off.
#
# Homing strategy: drive all 4 Z DOWN until each carriage stalls on its own
# bottom hard-stop block (no switches). Each stepper has its own virtual
# endstop, so each corner stops at its own block, giving 4-corner
# coplanarity with the block plane. Z_TILT_ADJUST is still available as a
# recalibration tool — see z_tilt.cfg. homing.cfg lowers the motor current
# for the homing move.
#
# Z homes toward the build surface, so G28 needs a clear build area.
#
# Position values: Z=0 is the build surface.
#   position_endstop / position_min — the nozzle height above the build
#     surface with all four carriages resting on their blocks. MEASURE it and
#     set both to that value.
#   position_max = position_endstop + stroke - 10 mm, rounded down. Unlike a
#     belt, a lead screw does not slip when driven into a hard limit. The
#     stroke is CAD-derived: CAD/z_travel.py measures 728.87 mm, from the nut
#     blocks on the bottom holders up to the Z-carriage V-wheels meeting the
#     underside of the top X rails. 718 holds only while position_endstop is
#     the 0 MEASURE placeholder; once it is measured, use 718 +
#     position_endstop. Confirm the stroke on SN 001 with slow jogs before
#     raising it, and never set this above the measured carriage travel minus
#     a margin.
#
# Direction: Z+ must move the gantry UP. If it moves down on the first jog,
# toggle the '!' on that stepper's dir_pin.
# ----------------------------------------------------------------------------

# S1 (MOTOR1) — Z0 front-left
[stepper_z]
step_pin: PC14
dir_pin: PC13
enable_pin: !PE6
rotation_distance: 2         # Tr8x2: 2 mm lead per revolution
microsteps: 16
full_steps_per_rotation: 200
endstop_pin: tmc5160_stepper_z:virtual_endstop
position_endstop: 0          # MEASURE — see header
position_min: 0              # keep equal to position_endstop
position_max: 718            # = position_endstop + 728.87 (CAD stroke) - 10; see header
homing_speed: 5              # mm/s = 2.5 rev/s on Tr8x2; tune with StallGuard
homing_retract_dist: 0       # sensorless homing: no second touch
homing_positive_dir: false   # home DOWN onto the bottom hard-stop blocks

# S2 (MOTOR2) — Z1 front-right
[stepper_z1]
step_pin: PE5
dir_pin: PE4
enable_pin: !PE3
rotation_distance: 2
microsteps: 16
full_steps_per_rotation: 200
endstop_pin: tmc5160_stepper_z1:virtual_endstop

# S3 (MOTOR3) — Z2 rear-left
[stepper_z2]
step_pin: PE2
dir_pin: PE1
enable_pin: !PE0
rotation_distance: 2
microsteps: 16
full_steps_per_rotation: 200
endstop_pin: tmc5160_stepper_z2:virtual_endstop

# S4 (MOTOR4) — Z3 rear-right
[stepper_z3]
step_pin: PB9
dir_pin: PB8
enable_pin: !PB7
rotation_distance: 2
microsteps: 16
full_steps_per_rotation: 200
endstop_pin: tmc5160_stepper_z3:virtual_endstop

# ============================================================================
# EXTRUDER — printhead extruder / nozzle valve (S8 / MOTOR8, onboard driver)
# ============================================================================
# The slicer's E moves drive this stepper. The material pump is a MAI 2PUMP
# Pictor (owner-supplied, outside the motion system). It is not modelled in
# this reference: M3-CRETE-FIRMWARE's Stage 3 notes define how Klipper
# commands it.
# ============================================================================
[extruder]
step_pin: PG15
dir_pin: PB6
enable_pin: !PG14
microsteps: 16
full_steps_per_rotation: 200
# Valve geometry — calibrate per your nozzle valve mechanism.
# Small value: the valve moves a small volume per rev (it's a metering gate,
# not a material-pushing auger).
rotation_distance: 8.0       # PLACEHOLDER — calibrate per valve design
nozzle_diameter: 25.0        # mm — concrete nozzle bore (typical 20–40mm)
filament_diameter: 25.0      # match nozzle_diameter for volumetric flow
max_extrude_only_distance: 500.0
max_extrude_only_velocity: 50.0
max_extrude_only_accel: 500.0
# Zero pressure advance on the valve — it's a local, fast actuator
pressure_advance: 0.0
pressure_advance_smooth_time: 0.040
# Concrete is unheated, but Klipper's [extruder] requires a heater and a
# temperature sensor. The heater points at the Kraken's HE0 output, with
# nothing connected. The sensor is the Kraken MCU's own temperature sensor,
# so no thermistor input is left open (an open input reads out of range and
# shuts Klipper down). TH0 carries the driver-cooling thermistor — see
# cooling.cfg.
heater_pin: PF6              # HE0 on Kraken — unused, nothing connected
sensor_type: temperature_mcu # Kraken STM32 die temperature — placeholder
control: pid
pid_Kp: 22.0
pid_Ki: 1.0
pid_Kd: 100.0
min_temp: -20                # margin for a cold shop
max_temp: 100                # MCU die temperature range
min_extrude_temp: 0          # CRITICAL: 0 disables cold-extrude safety
