# ============================================================================
# M3-CRETE — E-stop monitoring and motor-power control   (NOT LOADED YET)
# ============================================================================
# DEVELOPMENT REFERENCE: mirrors klipper/estop.cfg in
# github.com/sunnyday-technologies/M3-CRETE-FIRMWARE, which the machine runs.
#
# Load this file only after the E-stop and motor-power hardware it relies on
# is installed and tested on the machine. Then:
#   - uncomment  [include estop.cfg]  in printer.cfg, and
#   - add the [power motor_power] block to the Pi's moonraker.conf (see
#     moonraker.conf and README.md).
#
# The E-stop button removes motor power in hardware by itself. This file is a
# software layer on top of that, not a replacement for it:
#   - It watches the E-stop button's extra contact on Kraken endstop port 8
#     (MIN8, PC0). A press shuts Klipper down at once and is logged.
#   - It drives the Kraken PS-ON output (PD10). Motor power is allowed only
#     while PD10 is high. Klipper starts with it low, and any Klipper shutdown
#     (an E-stop press, M112 or an error) drives it low.
#   - MOTOR_POWER VALUE=1 / VALUE=0 switches motor power. It refuses to switch
#     on while the E-stop reads pressed. Mainsail's power button calls it.
#
# Low-voltage interface (owner-approved design):
#   - E-stop contact: normally open; closes to GND when the button is
#     pressed. Leave the S8 DIAG jumper off: it shares the MIN8 pin.
#   - PS-ON: the motor-power hardware must treat PD10 not driven high (Kraken
#     off, booting or shut down) as OFF.
#
# After an E-stop: release the button, FIRMWARE_RESTART, switch motor power
# on, then re-home before moving. X and Y may have moved while unpowered.
# ============================================================================

[gcode_button estop]
pin: ^!PC0                   # MIN8; '!' because the contact closes to GND when pressed
press_gcode:
    # action_emergency_stop runs while this template is rendered, before the
    # G-code queue, so a long command such as homing cannot delay it.
    {action_emergency_stop("E-stop button pressed")}

[output_pin motor_power]
pin: PD10                    # Kraken PS-ON header
value: 0                     # off when Klipper starts
shutdown_value: 0            # off on any Klipper shutdown

# Switching off: if the toolhead is moving, this stops Klipper the same way
# the E-stop does, because BTT says not to cut driver voltage while the board
# is driving the motors. If idle, it disables the motors first.
[gcode_macro MOTOR_POWER]
description: Motor power on (VALUE=1) or off (VALUE=0); refuses to switch on while the E-stop reads pressed
variable_value: 0
gcode:
    {% set v = params.VALUE|default(-1)|int %}
    {% if v == 1 %}
        {% if printer["gcode_button estop"].state == "PRESSED" %}
            { action_raise_error("E-stop reads pressed: release it before switching motor power on") }
        {% endif %}
        SET_PIN PIN=motor_power VALUE=1
        SET_GCODE_VARIABLE MACRO=MOTOR_POWER VARIABLE=value VALUE=1
    {% elif v == 0 %}
        {% if printer.idle_timeout.state == "Printing" %}
            { action_emergency_stop("motor power switched off while moving") }
        {% else %}
            M84              # disable the motors before removing their power
            SET_PIN PIN=motor_power VALUE=0
            SET_GCODE_VARIABLE MACRO=MOTOR_POWER VARIABLE=value VALUE=0
        {% endif %}
    {% else %}
        { action_raise_error("MOTOR_POWER needs VALUE=0 or VALUE=1") }
    {% endif %}
