# ============================================================================
# Homing Override — Sensorless (StallGuard) Sequence
# ============================================================================
# The sequence matters:
#   1. Z FIRST — drive all 4 Z posts DOWN onto their bottom hard-stop
#      blocks; each stalls independently, giving per-corner coplanarity.
#      The gantry then lifts 10 mm.
#   2. X SECOND — home X to 0 (left Z-post frame is the hard stop).
#   3. Y LAST — home Y to 0 (front Z-posts frame is the hard stop).
#
# Z homes toward the build surface, so G28 needs a clear build area. The
# 10 mm lift after Z keeps the nozzle off the surface while X and Y move.
#
# Lead screws turn motor torque into a large axial force, so Z homes at a
# reduced current (Z_HOME_CURRENT below) and restores run_current afterwards.
# Tune it together with driver_SGT in tmc.cfg: use the lowest current that
# still moves the gantry reliably.
#
# StallGuard requires a short dwell between sequential homing moves on the
# same driver — the TMC needs time to clear its stall latch. We use G4 P300
# between moves (300 ms), which is conservative.
#
# The homing_override block REPLACES the default G28 handler. Calls to
# G28 will invoke this macro instead.
# ============================================================================

[homing_override]
axes: xyz
set_position_x: 0
set_position_y: 0
set_position_z: 0
gcode:
    # -------- clear any previous stall latches --------
    {% set SGTHRS_X = printer.configfile.settings['tmc5160 stepper_x'].driver_sgt %}
    {% set SGTHRS_Y = printer.configfile.settings['tmc5160 stepper_y'].driver_sgt %}

    # -------- determine which axes to home --------
    {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}

    # -------- Z homing current (TUNE: start low, see header) --------
    {% set Z_HOME_CURRENT = 0.8 %}
    {% set Z_STEPPERS = ['stepper_z', 'stepper_z1', 'stepper_z2', 'stepper_z3'] %}

    # ============================================================
    # Z FIRST — quad sensorless home DOWN onto the hard-stop blocks
    # ============================================================
    {% if home_all or 'Z' in params %}
        M117 Homing Z (sensorless, quad-independent)
        {% for z in Z_STEPPERS %}
            SET_TMC_CURRENT STEPPER={z} CURRENT={Z_HOME_CURRENT}
        {% endfor %}
        G4 P300               ; let the current change settle
        # Real homing move: each Z stepper has its own virtual endstop
        # (steppers.cfg), so each corner stops on its own block.
        G28 Z0
        G4 P300               ; dwell for TMC to clear stall latch
        {% for z in Z_STEPPERS %}
            SET_TMC_CURRENT STEPPER={z} CURRENT={printer.configfile.settings['tmc5160 ' ~ z].run_current}
        {% endfor %}
        # Lift off the blocks so X/Y homing does not drag the nozzle
        G91
        G1 Z10 F300
        G90
    {% endif %}

    # ============================================================
    # X — sensorless home to left frame
    # ============================================================
    {% if home_all or 'X' in params %}
        M117 Homing X (sensorless)
        G4 P300               ; dwell before next stall move
        G28 X0
        G4 P300
    {% endif %}

    # ============================================================
    # Y — sensorless home to front frame
    # ============================================================
    {% if home_all or 'Y' in params %}
        M117 Homing Y (sensorless)
        G4 P300
        G28 Y0
        G4 P300
    {% endif %}

    # ============================================================
    # Park position after homing — X/Y center, Z at safe height
    # ============================================================
    {% if home_all %}
        G90
        G1 X50 Y50 F3000
        G1 Z100 F600          ; raise to 100 mm above the bed for calibration
        M117 Homed — ready
    {% endif %}

# ----------------------------------------------------------------------------
# HOME_Z — home only the four Z corners (used by the validation guide)
# ----------------------------------------------------------------------------
[gcode_macro HOME_Z]
description: Home the four Z corners down onto their hard-stop blocks
gcode:
    G28 Z
