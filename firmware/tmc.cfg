# ============================================================================
# TMC Driver Configuration — 7 motion drivers + nozzle valve
# ============================================================================
# DEVELOPMENT REFERENCE — not the machine config. The config SN 001 runs is
# klipper/printer.cfg in github.com/sunnyday-technologies/M3-CRETE-FIRMWARE.
#
# SPI: the Kraken's onboard drivers share a SOFTWARE SPI bus on PC6 (SCK),
# PC8 (MOSI) and PC7 (MISO); cs_pin selects the slot. Repeat the three
# spi_software_* pins in every section. There is no hardware spi_bus here.
#
# Chips: BTT lists the onboard drivers as TMC2160. Klipper drives them
# through [tmc5160] sections, as BTT's config and the verified Stage-1
# config do.
#
# sense_resistor DEPENDS ON THE SLOT AND THE BOARD REVISION
# (BTT Kraken wiki + generic-bigtreetech-kraken.cfg):
#   S1-S4  Kraken V1.0: 0.022   Kraken V1.1: 0.050   (BTT max 8 A / 4.7 A)
#   S5-S8  both revisions: 0.075                     (BTT max 3 A)
# Klipper computes the motor current from this value, so a wrong value
# silently scales the real current: 0.075 configured on a 0.022 slot gives
# about 3.4x the configured run_current. The values below are for a Kraken
# V1.0 (SN 001's board). On a V1.1, set the four Z sections to 0.050.
#
# Slot / pin map (BTT Kraken V1.0 pin diagram):
#   slot  section      cs_pin  diag1_pin (needs that slot's DIAG jumper)
#   S1    stepper_z    PD6     PC15
#   S2    stepper_z1   PD5     PF0
#   S3    stepper_z2   PD4     PF1
#   S4    stepper_z3   PD3     PF2
#   S5    stepper_x    PD2     PF3
#   S6    stepper_y    PA15    PF4
#   S7    stepper_y1   PA9     PF10  (not used — y1 follows stepper_y)
#   S8    extruder     PA10    PC0   (not used — the valve does not home)
# diag1_pin has no '^' pull-up, matching BTT's config and the verified
# Stage-1 config. Try '^' on a pin if its stall is never detected.
#
# run_current values (A RMS):
#   - Stay under BOTH the motor's rating and the slot limit above.
#     The BOM motor is 23HS45-4204S1 (4.2 A/phase). SN 001 runs 23HS22-2804S
#     (2.8 A/phase), which M3-CRETE-FIRMWARE caps at about 2.0 A RMS.
#   - Start LOW (1.2A), verify motion, then step up in 0.2A increments.
#
# StallGuard (sensorless homing) tuning:
#   driver_SGT: -64 (most sensitive) to +63 (least sensitive).
#   Start at SGT=2, watch for false triggers, adjust:
#     - False triggers during normal motion  -> raise SGT (less sensitive)
#     - Stall not detected at hard stop      -> lower SGT (more sensitive)
#   Iterate until you get a reliable single stall at the frame.
#
# driver_TCOOLTHRS: 0xFFFFF enables StallGuard at all speeds (required for
# homing). Do NOT enable CoolStep (SEMIN > 0) — it interferes with StallGuard.
# ============================================================================

# ----------------------------------------------------------------------------
# X (S5) — sensorless homing into left Z-post frame
# ----------------------------------------------------------------------------
[tmc5160 stepper_x]
cs_pin: PD2
spi_software_sclk_pin: PC6
spi_software_mosi_pin: PC8
spi_software_miso_pin: PC7
interpolate: True
run_current: 1.2             # START LOW — raise after first motion test
sense_resistor: 0.075        # S5-S8 slot value
diag1_pin: PF3               # StallGuard output (S5 DIAG jumper)
driver_SGT: 2                # TUNE THIS — see header comment
driver_TPOWERDOWN: 10
driver_TBL: 2
driver_TOFF: 3

# ----------------------------------------------------------------------------
# Y (S6, S7) — dual driver, sensorless homes BOTH together
# ----------------------------------------------------------------------------
[tmc5160 stepper_y]
cs_pin: PA15
spi_software_sclk_pin: PC6
spi_software_mosi_pin: PC8
spi_software_miso_pin: PC7
interpolate: True
run_current: 1.2
sense_resistor: 0.075        # S5-S8 slot value
diag1_pin: PF4               # S6 DIAG jumper
driver_SGT: 2
driver_TPOWERDOWN: 10
driver_TBL: 2
driver_TOFF: 3

[tmc5160 stepper_y1]
cs_pin: PA9
spi_software_sclk_pin: PC6
spi_software_mosi_pin: PC8
spi_software_miso_pin: PC7
interpolate: True
run_current: 1.2
sense_resistor: 0.075        # S5-S8 slot value
# y1 has no diag pin assigned — homing is synchronized via stepper_y's stall

# ----------------------------------------------------------------------------
# Z (S1-S4) — quad independent drivers, each stall-detects its own bottom
# hard-stop block. Homing runs at Z_HOME_CURRENT (homing.cfg); run_current
# below is for printing moves. Retune driver_SGT at the homing current for the
# lead screws.
# ----------------------------------------------------------------------------
[tmc5160 stepper_z]
cs_pin: PD6
spi_software_sclk_pin: PC6
spi_software_mosi_pin: PC8
spi_software_miso_pin: PC7
interpolate: True
run_current: 1.5             # Z carries more mass — slightly higher
sense_resistor: 0.022        # S1-S4 on Kraken V1.0 (V1.1: 0.050)
diag1_pin: PC15              # S1 DIAG jumper
driver_SGT: 4                # Z is usually less sensitive than X/Y
driver_TPOWERDOWN: 10
driver_TBL: 2
driver_TOFF: 3

[tmc5160 stepper_z1]
cs_pin: PD5
spi_software_sclk_pin: PC6
spi_software_mosi_pin: PC8
spi_software_miso_pin: PC7
interpolate: True
run_current: 1.5
sense_resistor: 0.022        # S1-S4 on Kraken V1.0 (V1.1: 0.050)
diag1_pin: PF0               # S2 DIAG jumper
driver_SGT: 4
driver_TPOWERDOWN: 10
driver_TBL: 2
driver_TOFF: 3

[tmc5160 stepper_z2]
cs_pin: PD4
spi_software_sclk_pin: PC6
spi_software_mosi_pin: PC8
spi_software_miso_pin: PC7
interpolate: True
run_current: 1.5
sense_resistor: 0.022        # S1-S4 on Kraken V1.0 (V1.1: 0.050)
diag1_pin: PF1               # S3 DIAG jumper
driver_SGT: 4
driver_TPOWERDOWN: 10
driver_TBL: 2
driver_TOFF: 3

[tmc5160 stepper_z3]
cs_pin: PD3
spi_software_sclk_pin: PC6
spi_software_mosi_pin: PC8
spi_software_miso_pin: PC7
interpolate: True
run_current: 1.5
sense_resistor: 0.022        # S1-S4 on Kraken V1.0 (V1.1: 0.050)
diag1_pin: PF2               # S4 DIAG jumper
driver_SGT: 4
driver_TPOWERDOWN: 10
driver_TBL: 2
driver_TOFF: 3

# ----------------------------------------------------------------------------
# EXTRUDER (nozzle valve) — S8 onboard driver
# ----------------------------------------------------------------------------
# The valve at the nozzle is a small, fast actuator with zero pressure
# advance. See steppers.cfg for the two-stage fluid architecture notes
# (valve in series with the upstream feed pump).
# ----------------------------------------------------------------------------
[tmc5160 extruder]
cs_pin: PA10
spi_software_sclk_pin: PC6
spi_software_mosi_pin: PC8
spi_software_miso_pin: PC7
interpolate: True
run_current: 1.0             # small valve motor — start LOW
sense_resistor: 0.075        # S5-S8 slot value
driver_TPOWERDOWN: 10
driver_TBL: 2
driver_TOFF: 3

# ----------------------------------------------------------------------------
# PUMP_FEED — external driver, NO TMC config needed
# ----------------------------------------------------------------------------
# The feed pump (NEMA34) runs on an external driver, not an onboard slot
# (step/dir/enable only). External drivers don't use SPI and don't need a
# [tmc5160 ...] section — Klipper just sends step pulses. Its signal pins are
# unassigned; see [extruder_stepper pump_feed] in steppers.cfg. Set microsteps
# and run current via the external driver's own settings.
