# ============================================================================
# Driver Cooling — enclosure thermistor + fans
# ============================================================================
# DEVELOPMENT REFERENCE — not the machine config. The config SN 001 runs is
# klipper/printer.cfg in github.com/sunnyday-technologies/M3-CRETE-FIRMWARE.
#
# A 100K NTC thermistor (BOM id 94) on the Kraken's TH0 input measures the
# board / enclosure temperature, and Klipper runs the two driver cooling fans
# (BOM id 95) from it. BTT's wiki recommends a driver cooling fan above 7 A of
# driver current.
#
# PLACEHOLDERS — set before use:
#   sensor_type  must match the thermistor fitted. "Generic 3950" is the
#                common 100K NTC with B = 3950.
#   pins         the Kraken fan headers the two fans use (FAN0 = PA0 and
#                FAN1 = PA1 here). Set each header's voltage jumper
#                (5/12/24 V) to the fans' voltage before connecting them —
#                see BTT's Kraken wiki.
#   target_temp  the enclosure temperature the fans hold below.
#
# The thermistor must be fitted: an open thermistor input reads out of range
# and Klipper shuts down. On shutdown the fans run at full speed.
#
# Mainsail shows this as "driver_cooling" with its temperature and fan speed.
# ============================================================================

# Both fan headers act as one output, so one control runs both fans.
[multi_pin driver_fans]
pins: PA0, PA1               # FAN0, FAN1 — PLACEHOLDER: the headers the fans use

[temperature_fan driver_cooling]
pin: multi_pin:driver_fans
sensor_type: Generic 3950    # PLACEHOLDER: match the fitted thermistor
sensor_pin: PB1              # TH0
min_temp: -20                # margin for a cold shop
max_temp: 80                 # Klipper shuts down above this
target_temp: 40.0            # PLACEHOLDER — tune for the enclosure
control: watermark
max_delta: 2.0               # fans on above 42 C, off below 38 C
max_speed: 1.0
min_speed: 0.0
shutdown_speed: 1.0          # full speed if Klipper shuts down
