# ============================================================================
# Driver Cooling — enclosure thermistor + fan
# ============================================================================
# DEVELOPMENT REFERENCE — not the machine config. The config SN 001 runs is
# klipper/printer.cfg in github.com/sunnyday-technologies/M3-CRETE-FIRMWARE.
#
# A 100K NTC thermistor on the Kraken's TH0 input measures the board /
# enclosure temperature, and Klipper runs the driver cooling fan from it.
# BTT's wiki recommends a driver cooling fan above 7 A of driver current.
#
# PLACEHOLDERS — set before use:
#   sensor_type  must match the thermistor fitted. "Generic 3950" is the
#                common 100K NTC with B = 3950.
#   pin          the Kraken fan header the cooling fans use (FAN0 = PA0 here).
#                Set that header's voltage jumper (5/12/24 V) to the fans'
#                voltage before connecting them — see BTT's Kraken wiki.
#   target_temp  the enclosure temperature the fan holds below.
#
# The thermistor must be fitted: an open thermistor input reads out of range
# and Klipper shuts down. On shutdown the fan runs at full speed.
#
# Mainsail shows this as "driver_cooling" with its temperature and fan speed.
# ============================================================================

[temperature_fan driver_cooling]
pin: PA0                     # FAN0 — PLACEHOLDER: the header the fans use
sensor_type: Generic 3950    # PLACEHOLDER: match the fitted thermistor
sensor_pin: PB1              # TH0
min_temp: -20                # margin for a cold shop
max_temp: 80                 # Klipper shuts down above this
target_temp: 40.0            # PLACEHOLDER — tune for the enclosure
control: watermark
max_delta: 2.0               # fan on above 42 C, off below 38 C
max_speed: 1.0
min_speed: 0.0
shutdown_speed: 1.0          # full speed if Klipper shuts down
